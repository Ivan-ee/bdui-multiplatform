<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Аренда — личный кабинет (PoC)</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Диагностика прототипа: последняя ошибка страницы видна в title.
      window.addEventListener('error', e => { document.title = 'ERR: ' + (e.message || e.type); });
      window.addEventListener('unhandledrejection', e => { document.title = 'REJ: ' + (e.reason && e.reason.message || e.reason); });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
